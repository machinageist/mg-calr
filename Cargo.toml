[package]
name = "mg-calr"
version = "0.1.0"
edition = "2024"
description = "Keyboard-first local calendar foundation"
rust-version = "1.85"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
sha2 = "0.10"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tokio-postgres = { version = "0.7", features = ["with-chrono-0_4", "with-uuid-1", "with-serde_json-1"] }
toml = "0.9"
uuid = { version = "1", features = ["serde", "v7"] }
fs2 = "0.4.3"
libc = "0.2"
rustix = { version = "1.1", features = ["fs"] }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "deny"
pedantic = "deny"
