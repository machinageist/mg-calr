[package]
name = "mg-calr"
version = "0.1.0"
edition = "2024"
description = "Keyboard-first local calendar foundation"
license = "MIT"
rust-version = "1.85"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
sha2 = "0.10"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
# the suite's SQLite version
rusqlite = "0.32"
toml = "0.9"
uuid = { version = "1", features = ["serde", "v7"] }
fs2 = "0.4.3"
libc = "0.2"
rustix = { version = "1.1", features = ["fs"] }

[dev-dependencies]
assert_cmd = "2"
# only to drive the notification backend's futures in tests; the store is synchronous
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
predicates = "3"
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "deny"
pedantic = "deny"
